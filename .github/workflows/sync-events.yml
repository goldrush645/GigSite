name: Refresh NSW concert listings — Moshtix and Ticketmaster
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-events.yml'
      - 'scripts/sync-events.mjs'
      - 'scripts/sync-ticketmaster.mjs'
      - 'scripts/test-ticketmaster.mjs'
      - 'scripts/artist-names.mjs'
      - 'scripts/test-artists.mjs'
  schedule:
    - cron: '17 20 * * *' # once a day, 07:17 AEDT in summer
concurrency:
  group: encore-event-import
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Start from current main
        # Push-triggered jobs may check out a commit that is already stale.
        # Refresh before importing so old feed revisions cannot rebase over new ones.
        run: |
          git fetch origin main
          git checkout -B main origin/main
      - name: Fetch Moshtix public event records
        run: node scripts/sync-events.mjs
      - name: Check Ticketmaster importer fixtures
        run: node --test scripts/test-ticketmaster.mjs scripts/test-artists.mjs
      - name: Fetch Ticketmaster events when API key is configured
        env:
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
        run: node scripts/sync-ticketmaster.mjs
      - name: Commit refreshed event feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/events.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh ENCORE official NSW event feed (Moshtix + Ticketmaster)"
            # Avoid rejecting updates made while the API job was running.
            # Never force-push or overwrite newer work.
            if ! git pull --rebase origin main; then
              git rebase --abort || true
              echo "::error::Concurrent event-feed update detected. No stale feed was published."
              exit 1
            fi
            git push origin HEAD:main
          fi

<script>
(()=>{'use strict';
const icons={heart:'<path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8Z"/>',search:'<circle cx="11" cy="11" r="7"/><path d="m16 16 5 5"/>',pin:'<path d="M20 10c0 5-8 12-8 12S4 15 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2.5"/>',calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/>',compass:'<circle cx="12" cy="12" r="9"/><path d="m16 8-2.5 5.5L8 16l2.5-5.5z"/>',music:'<path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>',bell:'<path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/>',arrow:'<path d="M5 12h14m-6-6 6 6-6 6"/>',close:'<path d="M18 6 6 18M6 6l12 12"/>',ticket:'<path d="M2 9V5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v4a3 3 0 0 0 0 6v4a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2v-4a3 3 0 0 0 0-6Z"/>',sparkle:'<path d="m12 3 2.2 6.8L21 12l-6.8 2.2L12 21l-2.2-6.8L3 12l6.8-2.2z"/>'};
const icon=x=>`<svg aria-hidden="true" viewBox="0 0 24 24">${icons[x]||icons.music}</svg>`;
const artists=['The Halftones','Nova Bloom','The Static Hours','Night Swimming','Cassette City','Echo Assembly','Velvet Coast','Fallow','Glass Signal','Summer Arcade'];
const events=[
{id:'e1',name:'The Halftones',short:'THE\nHALFTONES',tour:'Southern Skies Tour',city:'Sydney',venue:'Enmore Theatre',date:'2026-12-04',time:'7:30 PM',genre:'Indie',announced:'12 MIN AGO',minutes:12,stage:'presale',presale:'Wed 11 Nov · 10am',sale:'Fri 13 Nov · 10am',art:'art-a'},
{id:'e2',name:'Nova Bloom',short:'NOVA\nBLOOM',tour:'Afterlight Tour',city:'Wollongong',venue:'UniBar Wollongong',date:'2026-11-28',time:'8:00 PM',genre:'Electronic',announced:'2 HRS AGO',minutes:120,stage:'soon',presale:'Not announced',sale:'Thu 12 Nov · 9am',art:'art-b'},
{id:'e3',name:'The Static Hours',short:'STATIC\nHOURS',tour:'Australian Headline Shows',city:'Sydney',venue:'Metro Theatre',date:'2026-12-19',time:'7:00 PM',genre:'Rock',announced:'5 HRS AGO',minutes:300,stage:'sold',presale:'Finished',sale:'Sold out',art:'art-c'},
{id:'e4',name:'Night Swimming',short:'NIGHT\nSWIMMING',tour:'Blue Room',city:'Newcastle',venue:'King Street',date:'2027-01-22',time:'8:00 PM',genre:'Indie',announced:'1 DAY AGO',minutes:1440,stage:'on',presale:'Finished',sale:'On sale',art:'art-d'},
{id:'e5',name:'Cassette City',short:'CASSETTE\nCITY',tour:'Midnight Signals',city:'Wollongong',venue:'North Gong Hotel',date:'2026-12-12',time:'7:00 PM',genre:'Pop',announced:'2 DAYS AGO',minutes:2880,stage:'on',presale:'Finished',sale:'On sale',art:'art-e'},
{id:'e6',name:'Echo Assembly',short:'ECHO\nASSEMBLY',tour:'Colour Theory',city:'Sydney',venue:'Hordern Pavilion',date:'2027-02-06',time:'6:30 PM',genre:'Electronic',announced:'3 DAYS AGO',minutes:4320,stage:'soon',presale:'Thu 12 Nov · 10am',sale:'Mon 16 Nov · 10am',art:'art-f'},
{id:'e7',name:'Velvet Coast',short:'VELVET\nCOAST',tour:'East Coast Run',city:'Newcastle',venue:'Bar on the Hill',date:'2027-03-13',time:'7:30 PM',genre:'Rock',announced:'4 DAYS AGO',minutes:5760,stage:'on',presale:'Finished',sale:'On sale',art:'art-g'},
{id:'e8',name:'Fallow',short:'FALLOW',tour:'The New Shapes Tour',city:'Wollongong',venue:'La La La’s',date:'2027-02-14',time:'7:00 PM',genre:'Indie',announced:'6 DAYS AGO',minutes:8640,stage:'sold',presale:'Finished',sale:'Sold out',art:'art-h'}
];
const festivals=[
{id:'f1',name:'Sunset Sound',short:'SUNSET\nSOUND',city:'Sydney',venue:'Centennial Park',date:'2027-02-20',date2:'2027-02-21',art:'art-a',lineup:['The Halftones','Echo Assembly','Velvet Coast','Glass Signal','Fallow'],tag:'LINEUP ANNOUNCED'},
{id:'f2',name:'Coastal Frequency',short:'COASTAL\nFREQUENCY',city:'Wollongong',venue:'Stuart Park',date:'2027-03-06',date2:'2027-03-06',art:'art-b',lineup:['Nova Bloom','Night Swimming','Cassette City','The Static Hours'],tag:'FIRST WAVE'},
{id:'f3',name:'Northern Fields',short:'NORTHERN\nFIELDS',city:'Newcastle',venue:'Foreshore Park',date:'2027-04-17',date2:'2027-04-18',art:'art-c',lineup:['Velvet Coast','Fallow','Night Swimming'],tag:'LINEUP UPDATED'}
];
const storeKey='encore-v2-prototype';
const state={page:'discover',city:'All cities',genre:'All',sort:'new',query:'',following:new Set(['The Halftones','Nova Bloom','Night Swimming']),watch:new Set(),reminders:new Set(),festivals:new Set(),detail:null};
try{const prev=JSON.parse(localStorage.getItem(storeKey)||'null');if(prev){state.following=new Set(prev.following||[]);state.watch=new Set(prev.watch||[]);state.reminders=new Set(prev.reminders||[]);state.festivals=new Set(prev.festivals||[]);state.city=prev.city||'All cities'}}catch(e){}
function save(){try{localStorage.setItem(storeKey,JSON.stringify({following:[...state.following],watch:[...state.watch],reminders:[...state.reminders],festivals:[...state.festivals],city:state.city}))}catch(e){}}
const root=document.getElementById('app');
const date=s=>new Date(s+'T12:00:00').toLocaleDateString('en-AU',{day:'numeric',month:'short',year:'numeric'});
const tag=e=>e.stage==='sold'?'SOLD OUT':e.stage==='on'?'ON SALE':e.stage==='presale'?'PRESALE SOON':'ON SALE SOON';
function toast(s){document.querySelector('.toast')?.remove();const e=document.createElement('div');e.className='toast';e.setAttribute('role','status');e.textContent=s;document.body.append(e);setTimeout(()=>e.remove(),3200)}
const navButton=(page,label)=>`<button type="button" data-page="${page}" class="${state.page===page?'active':''}" aria-current="${state.page===page?'page':'false'}">${label}</button>`;
function header(){return `<header class="site-head"><button class="logo" type="button" data-page="discover" aria-label="ENCORE home">ENCORE<span class="logo-dot">.</span></button><nav class="nav" aria-label="Main">${navButton('discover','Home')}${navButton('following','My Artists')}</nav><div class="header-right"><label class="search">${icon('search')}<input id="search" type="search" autocomplete="off" placeholder="Search gigs" aria-label="Search artists and shows" value="${escapeHtml(state.query)}"></label><label class="city">${icon('pin')}<select id="city" aria-label="Selected city">${['All cities','Sydney','Wollongong','Newcastle'].map(c=>`<option ${state.city===c?'selected':''}>${c}</option>`).join('')}</select></label></div><div class="header-avatar" aria-label="Prototype user">YOU</div></header>`}
function mobileNav(){return `<nav class="mobile-nav" aria-label="Mobile navigation"><button type="button" data-page="discover" class="${state.page==='discover'?'active':''}">${icon('compass')}Home</button><button type="button" data-page="following" class="${state.page==='following'?'active':''}">${icon('heart')}My Artists</button></nav>`}
function eventsFiltered(onlyFollowing=false){const q=state.query.toLowerCase().trim();return events.filter(e=>(state.city==='All cities'||e.city===state.city)&&(onlyFollowing||state.genre==='All'||state.genre===e.genre)&&(!onlyFollowing||state.following.has(e.name))&&(!q||[e.name,e.city,e.venue,e.tour,e.genre].join(' ').toLowerCase().includes(q))).sort((a,b)=>state.sort==='date'?a.date.localeCompare(b.date):a.minutes-b.minutes)}
function eventCard(e){const followed=state.following.has(e.name);return `<article class="event-card"><div class="event-art ${e.art}"><div class="art-top"><span class="tag ${e.stage==='sold'?'sold':''}">${e.stage==='sold'?'SOLD OUT':'✳ '+e.announced}</span><button type="button" class="heart-btn ${followed?'on':''}" data-follow="${e.name}" aria-label="${followed?'Unfollow':'Follow'} ${e.name}" aria-pressed="${followed}">${icon('heart')}</button></div><div class="art-bottom"><span class="art-date">${date(e.date).toUpperCase()}</span><strong class="art-name">${e.short.replace(/\n/g,'<br>')}</strong></div></div><div class="event-body"><h3>${e.name}</h3><div class="event-info">${icon('pin')}${e.venue} · ${e.city}</div><div class="event-info">${icon('calendar')}${date(e.date)} · ${e.time}</div><div class="event-bottom"><small class="${e.stage==='sold'?'sold':''}">${tag(e)}</small><button type="button" data-open="${e.id}">View event →</button></div></div></article>`}
function filterBar(){return `<div class="filters">${['All','Indie','Rock','Pop','Electronic'].map(c=>`<button type="button" data-genre="${c}" class="chip ${c===state.genre?'active':''}">${c==='All'?'All genres':c}</button>`).join('')}<select id="sort" class="sort" aria-label="Sort events"><option value="new" ${state.sort==='new'?'selected':''}>Recently announced</option><option value="date" ${state.sort==='date'?'selected':''}>Event date</option></select></div>`}
function discover(){
const announced=eventsFiltered();
const followed=eventsFiltered(true);
const q=state.query.toLowerCase().trim();
const nearbyFestivals=festivals.filter(f=>(state.city==='All cities'||f.city===state.city)&&(!q||[f.name,f.city,f.venue,...f.lineup].join(' ').toLowerCase().includes(q)));
return `<section class="hero"><div class="hero-inner"><div class="kick">LIVE MUSIC, FIRST</div><h1>DON'T<br>MISS <span class="outline">THE</span><br>DROP.</h1><p>Tour announcements, local gigs and festivals — find out before the tickets disappear.</p><div class="hero-buttons"><button type="button" class="primary-btn" data-scroll="announced">Explore shows ${icon('arrow')}</button><button type="button" class="secondary-btn" data-page="following">My artists ${icon('heart')}</button></div></div><div class="poster-ticket" aria-hidden="true"><span>ENCORE / 001</span><strong>LOUD<br>&<br>LIVE.</strong><small>YOUR CITY · YOUR MUSIC</small></div></section>
<div class="ticker">JUST ANNOUNCED <i>✳</i> YOUR CITY <i>✳</i> YOUR ARTISTS <i>✳</i> FIRST IN LINE</div>
<section class="section" id="announced"><div class="section-head"><div><h2>JUST ANNOUNCED<span style="color:var(--orange)">✳</span></h2><p>New shows in your selected area. Filter by genre or date.</p></div></div>${filterBar()}<div class="event-grid">${announced.length?announced.map(eventCard).join(''):empty('No matching announcements','Try another city, genre or search.')}</div></section>
<section class="section" id="your-gigs"><div class="section-head"><div><h2>GIGS FROM <span style="color:var(--violet)">YOUR ARTISTS.</span></h2><p>Upcoming shows from artists you follow, updated when you follow or unfollow someone.</p></div><button type="button" data-page="following">Manage artists →</button></div><div class="event-grid">${followed.length?followed.map(eventCard).join(''):empty('Nothing from your artists here yet','Follow more artists or change your city to see upcoming gigs.')}</div></section>
<section class="section" id="festivals"><div class="section-head"><div><h2>FESTIVALS<span style="color:var(--pink)">✳</span></h2><p>Lineups, dates, and artists you already follow — right here on the homepage.</p></div></div><div class="festival-grid">${nearbyFestivals.length?nearbyFestivals.map(festivalCard).join(''):empty('No festivals found','Try a different city or search.')}</div></section>`;
}
function artistCard(name,i){const on=state.following.has(name),matches=events.filter(e=>e.name===name).length;return `<div class="artist"><span class="artist-avatar ${['art-a','art-b','art-c','art-d','art-e','art-f','art-g','art-h'][i%8]}">${name.split(' ').map(x=>x[0]).slice(0,2).join('')}</span><span class="artist-copy"><strong>${name}</strong><small>${matches} sample show${matches===1?'':'s'}</small></span><button type="button" class="${on?'on':''}" data-follow="${name}">${on?'Following ✓':'+ Follow'}</button></div>`}
function followingPage(){
const q=state.query.toLowerCase().trim();
const followed=artists.filter(a=>state.following.has(a)&&(!q||a.toLowerCase().includes(q)));
const more=artists.filter(a=>!state.following.has(a)&&(!q||a.toLowerCase().includes(q)));
return `<section class="page-head"><div class="kick">YOUR MUSIC</div><h1 class="page-title">MY ARTISTS.</h1><p class="page-intro">Your followed artists, all in one place. Manage your follows here; their upcoming shows appear on your homepage.</p></section><section class="section"><div class="section-head"><div><h2>FOLLOWING <span style="color:var(--violet)">(${state.following.size})</span></h2><p>The artists you want alerts and gig updates for.</p></div><button type="button" data-page="discover">Back to gigs →</button></div><div class="artists-grid">${followed.length?followed.map((n)=>artistCard(n,artists.indexOf(n))).join(''):empty('No followed artists matched','Search for another artist or follow one below.')}</div></section><section class="section"><div class="section-head"><div><h2>FIND MORE ARTISTS</h2><p>Example artists to follow in this interactive prototype.</p></div></div><div class="artists-grid">${more.length?more.map((n)=>artistCard(n,artists.indexOf(n))).join(''):empty('No other artists matched','Try a different search.')}</div></section>`;
}
function festivalCard(f){const on=state.festivals.has(f.id),matches=f.lineup.filter(a=>state.following.has(a));return `<article class="festival-card"><div class="festival-art ${f.art}"><small>${f.tag} · ${f.city.toUpperCase()}</small><strong>${f.short.replace(/\n/g,'<br>')}</strong><small>${date(f.date).toUpperCase()}</small></div><div class="festival-body"><h3>${f.name}</h3><div class="event-info">${icon('pin')}${f.venue} · ${f.city}</div><div class="event-info">${icon('calendar')}${date(f.date)}${f.date2!==f.date?' – '+date(f.date2):''}</div><p><b>Lineup:</b> ${f.lineup.join(' · ')}</p><div class="match">${matches.length} of your artists in the lineup</div><div class="festival-bottom"><button type="button" data-festival="${f.id}">${on?'Following ✓':'+ Follow festival'}</button><button type="button" data-open="${f.id}">Full lineup →</button></div></div></article>`}
function festivalsPage(){const q=state.query.toLowerCase();const list=festivals.filter(f=>(state.city==='All cities'||state.city===f.city)&&(!q||[f.name,f.city,f.venue,...f.lineup].join(' ').toLowerCase().includes(q)));return `<section class="page-head"><div class="kick">BIG DAYS OUT</div><h1 class="page-title">FESTIVAL SEASON.</h1><p class="page-intro">Explore lineups, see which of your artists are playing, and follow festivals for future updates.</p></section><section class="section"><div class="festival-grid">${list.length?list.map(festivalCard).join(''):empty('No festivals found','Try another city or search.')}</div></section>`}
function empty(title,msg){return `<div class="empty"><h3>${title}</h3><p>${msg}</p></div>`}
function eventDetail(e){const on=state.following.has(e.name),watch=state.watch.has(e.id),rem=state.reminders.has(e.id),sold=e.stage==='sold';return `<div class="drawer-art ${e.art}"><strong>${e.short.replace(/\n/g,'<br>')}</strong></div><div class="drawer-content"><div class="kick">DEMO CONCERT · ${e.announced}</div><h2 class="detail-title">${e.name}</h2><p class="detail-sub">${e.tour}</p><div class="detail-row">${icon('calendar')}${date(e.date)} · ${e.time}</div><div class="detail-row">${icon('pin')}${e.venue}, ${e.city}, NSW</div><div class="detail-actions"><button type="button" class="secondary-btn" data-follow="${e.name}">${icon('heart')}${on?'Following ✓':'Follow artist'}</button>${!sold?`<button type="button" class="outline-btn" data-reminder="${e.id}">${icon('bell')}${rem?'Reminder saved ✓':'On-sale reminder'}</button>`:''}</div><div class="divider"></div><h3 class="detail-heading">TICKET TIMELINE</h3><div class="timeline"><div class="time-cell"><small>First detected</small><strong>${e.announced.toLowerCase()}<br>(fictional)</strong></div><div class="time-cell"><small>Presale</small><strong>${e.presale}</strong></div><div class="time-cell"><small>General sale</small><strong>${e.sale}</strong></div></div><div class="divider"></div><h3 class="detail-heading">TICKET OPTIONS</h3><div class="ticket-option"><span><strong>Official seller</strong><small>${sold?'Sold out in this fictional listing':'Live link not connected yet'}</small></span><button type="button" data-info="Official seller links will open once a verified event API is connected.">${sold?'Sold out':'Ticket site ↗'}</button></div>${sold?`<div class="ticket-option"><span><strong>Tixel resale</strong><small>Inventory and price not connected</small></span><button type="button" data-info="Tixel availability requires an authorised integration and verified event match.">Check ↗</button></div><div class="ticket-option"><span><strong>Viagogo resale</strong><small>Inventory and price not connected</small></span><button type="button" data-info="Viagogo availability requires approved API access and verified event matching.">Check ↗</button></div><button type="button" class="alert-btn ${watch?'active':''}" data-watch="${e.id}">${icon('bell')}${watch?'Resale watch saved ✓':'Notify me when resale appears'}</button>`:''}<p class="detail-note">All listings in this prototype are fictional. Following, saved reminders and resale watches are demo interactions only; no emails or availability checks are running.</p></div>`}
function festivalDetail(f){const matches=f.lineup.filter(a=>state.following.has(a)),on=state.festivals.has(f.id);return `<div class="drawer-art ${f.art}"><strong>${f.short.replace(/\n/g,'<br>')}</strong></div><div class="drawer-content"><div class="kick">DEMO FESTIVAL</div><h2 class="detail-title">${f.name}</h2><div class="detail-row">${icon('calendar')}${date(f.date)}${f.date!==f.date2?' – '+date(f.date2):''}</div><div class="detail-row">${icon('pin')}${f.venue}, ${f.city}, NSW</div><div class="divider"></div><h3 class="detail-heading">LINEUP</h3><p class="detail-sub" style="line-height:2.2">${f.lineup.map(a=>state.following.has(a)?`<strong style="color:#6e44bb">${a} ✳</strong>`:a).join(' · ')}</p><div class="match">${matches.length} followed artist${matches.length===1?'':'s'} on this lineup</div><div class="detail-actions"><button type="button" class="primary-btn" data-festival="${f.id}">${on?'Following festival ✓':'+ Follow festival'}</button><button type="button" class="secondary-btn" data-info="Festival ticket links will be available when verified event sources are connected.">Official tickets ↗</button></div><p class="detail-note">This is a fictional festival. Following is a local demo interaction; no lineup alerts are currently sent.</p></div>`}
function detail(){if(!state.detail)return '';const e=events.find(x=>x.id===state.detail),f=festivals.find(x=>x.id===state.detail);if(!e&&!f)return '';return `<div class="shade" id="shade"><section class="drawer" role="dialog" aria-modal="true" aria-label="${e?'Concert':'Festival'} details"><div class="drawer-head"><span>EVENT DETAILS / ENCORE</span><button type="button" class="icon-btn" data-close aria-label="Close event details">${icon('close')}</button></div>${e?eventDetail(e):festivalDetail(f)}</section></div>`}
function escapeHtml(str){return String(str).replaceAll('&','&amp;').replaceAll('"','&quot;').replaceAll('<','&lt;').replaceAll('>','&gt;')}
function render(opts={}){root.innerHTML=`<div class="app">${header()}<main class="content"><div class="demo">${icon('sparkle')}<span>DESIGN PROTOTYPE — Artists, event dates, sale statuses and festival lineups are fictional. Controls work locally; real tickets and alerts are not connected.</span></div>${state.page==='discover'?discover():followingPage()}<footer class="footer"><span>ENCORE. / LIVE MUSIC, FIRST.</span><span>Design exploration · Version 3</span></footer></main>${mobileNav()}${detail()}</div>`;document.body.style.overflow=state.detail?'hidden':'';if(opts.focus){const el=document.getElementById('search');el?.focus();try{el?.setSelectionRange(opts.pos,opts.pos)}catch(e){}}}
function changePage(page){state.page=page;state.query='';state.detail=null;render();window.scrollTo({top:0,behavior:'instant'})}
function close(){state.detail=null;render()}
document.addEventListener('click',e=>{if(e.target.id==='shade'){close();return}const b=e.target.closest('button');if(!b)return;if(b.hasAttribute('data-close')){close();return}if(b.dataset.page){changePage(b.dataset.page);return}if(b.dataset.scroll){document.getElementById(b.dataset.scroll)?.scrollIntoView({behavior:'smooth',block:'start'});return}if(b.dataset.genre){state.genre=b.dataset.genre;render();return}if(b.dataset.follow){const n=b.dataset.follow;const on=state.following.has(n);on?state.following.delete(n):state.following.add(n);save();render();toast(`${n} ${on?'unfollowed':'followed'} (demo)`);return}if(b.dataset.open){state.detail=b.dataset.open;render();const drawer=document.querySelector('.drawer');if(drawer)drawer.scrollTop=0;return}if(b.dataset.reminder){const id=b.dataset.reminder,on=state.reminders.has(id);on?state.reminders.delete(id):state.reminders.add(id);save();render();toast(on?'Demo reminder removed':'Reminder saved locally — no alerts sent');return}if(b.dataset.watch){const id=b.dataset.watch,on=state.watch.has(id);on?state.watch.delete(id):state.watch.add(id);save();render();toast(on?'Resale watch removed':'Resale watch saved locally — no monitoring active');return}if(b.dataset.festival){const id=b.dataset.festival,on=state.festivals.has(id);on?state.festivals.delete(id):state.festivals.add(id);save();render();toast(on?'Festival unfollowed':'Festival followed (demo)');return}if(b.dataset.info){toast(b.dataset.info)}});
document.addEventListener('input',e=>{if(e.target.id==='search'){state.query=e.target.value;const pos=e.target.selectionStart;render({focus:true,pos})}});
document.addEventListener('change',e=>{if(e.target.id==='city'){state.city=e.target.value;save();render();toast(`Now showing ${state.city.toLowerCase()}`)}if(e.target.id==='sort'){state.sort=e.target.value;render()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&state.detail)close()});
render();
})();
</script>
</body>
</html>

<body>
<div id="app"></div>
<script>
(()=>{'use strict';
const icons={heart:'<path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8Z"/>',search:'<circle cx="11" cy="11" r="7"/><path d="m16 16 5 5"/>',pin:'<path d="M20 10c0 5-8 12-8 12S4 15 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2.5"/>',calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/>',compass:'<circle cx="12" cy="12" r="9"/><path d="m16 8-2.5 5.5L8 16l2.5-5.5z"/>',music:'<path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>',bell:'<path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/>',arrow:'<path d="M5 12h14m-6-6 6 6-6 6"/>',close:'<path d="M18 6 6 18M6 6l12 12"/>',ticket:'<path d="M2 9V5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v4a3 3 0 0 0 0 6v4a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2v-4a3 3 0 0 0 0-6Z"/>',sparkle:'<path d="m12 3 2.2 6.8L21 12l-6.8 2.2L12 21l-2.2-6.8L3 12l6.8-2.2z"/>'};
const icon=x=>`<svg aria-hidden="true" viewBox="0 0 24 24">${icons[x]||icons.music}</svg>`;
const artists=[];
const events=[];
const festivals=[];
let dataStatus='Loading verified events…';
let sourceUpdatedAt=null;
const storeKey='encore-real-v1';
const state={page:'discover',city:'All cities',genre:'All',sort:'new',query:'',following:new Set(),watch:new Set(),reminders:new Set(),festivals:new Set(),detail:null};
try{const prev=JSON.parse(localStorage.getItem(storeKey)||'null');if(prev){state.following=new Set(prev.following||[]);state.watch=new Set(prev.watch||[]);state.reminders=new Set(prev.reminders||[]);state.festivals=new Set(prev.festivals||[]);state.city=prev.city||'All cities'}}catch(e){}
function save(){try{localStorage.setItem(storeKey,JSON.stringify({following:[...state.following],watch:[...state.watch],reminders:[...state.reminders],festivals:[...state.festivals],city:state.city}))}catch(e){}}
const root=document.getElementById('app');
const date=s=>s?new Date(s+'T12:00:00').toLocaleDateString('en-AU',{day:'numeric',month:'short',year:'numeric'}):'Date TBA';
const tag=e=>e.stage==='sold'?'SOLD OUT':e.stage==='on'?'ON SALE':e.stage==='presale'?'PRESALE SOON':'CHECK TICKETS';
let logoTapCount=0,logoTapTime=0;
function toast(s){document.querySelector('.toast')?.remove();const e=document.createElement('div');e.className='toast';e.setAttribute('role','status');e.textContent=s;document.body.append(e);setTimeout(()=>e.remove(),3200)}
const navButton=(page,label)=>`<button type="button" data-page="${page}" class="${state.page===page?'active':''}" aria-current="${state.page===page?'page':'false'}">${label}</button>`;
function header(){return `<header class="site-head"><button class="logo" type="button" data-page="discover" aria-label="ENCORE home">ENCORE<span class="logo-dot">.</span></button><nav class="nav" aria-label="Main">${navButton('discover','Home')}${navButton('following','My Artists')}</nav><div class="header-right"><div class="search-combo"><label class="search">${icon('search')}<input id="search" type="search" autocomplete="off" spellcheck="false" placeholder="Search artists, gigs, festivals" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="search-suggestions" aria-label="Search artists, gigs and festivals" value="${escapeHtml(state.query)}"></label><div id="search-suggestions" class="search-suggestions" role="listbox" aria-label="Search suggestions" hidden></div></div><label class="city">${icon('pin')}<select id="city" aria-label="Selected city">${['All cities','Sydney','Wollongong','Newcastle'].map(c=>`<option ${state.city===c?'selected':''}>${c}</option>`).join('')}</select></label></div><div class="header-avatar" aria-label="Prototype user">YOU</div></header>`}
function mobileNav(){return `<nav class="mobile-nav" aria-label="Mobile navigation"><button type="button" data-page="discover" class="${state.page==='discover'?'active':''}">${icon('compass')}Home</button><button type="button" data-page="following" class="${state.page==='following'?'active':''}">${icon('heart')}My Artists</button></nav>`}

const artistForEvent=e=>Object.prototype.hasOwnProperty.call(e,'artistName')?e.artistName||null:e.name;
const normSearch=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLocaleLowerCase().trim();
let suggestionChoices=[], activeSuggestion=-1;
function suggestedItems(){
 const q=normSearch(state.query);
 if(!q)return [];
 const rank=name=>{const s=normSearch(name);return s===q?0:s.startsWith(q)?1:s.includes(q)?2:3};
 const matches=text=>normSearch(text).includes(q);
 const a=artists.filter(n=>matches(n)).sort((x,y)=>rank(x)-rank(y)||x.localeCompare(y)).slice(0,4).map(name=>({type:'artist',id:name,name,meta:'Artist'}));
 const ev=events.filter(e=>[e.name,e.title,e.venue,e.tour,e.city].some(matches)).sort((x,y)=>rank(x.name)-rank(y.name)||x.date.localeCompare(y.date)).slice(0,5).map(e=>({type:'event',id:e.id,name:e.name,meta:e.city+' · '+date(e.date)}));
 const fs=festivals.filter(f=>[f.name,f.city,f.venue,...(f.lineup||[])].some(matches)).sort((x,y)=>rank(x.name)-rank(y.name)).slice(0,3).map(f=>({type:'festival',id:f.id,name:f.name,meta:f.city+' · '+date(f.date)}));
 return [...a,...ev,...fs];
}
function hideSuggestions(){
 const menu=document.getElementById('search-suggestions');const input=document.getElementById('search');
 if(menu)menu.hidden=true;
 input?.setAttribute('aria-expanded','false'); input?.removeAttribute('aria-activedescendant');
 activeSuggestion=-1;
}
function updateSuggestions(){
 const menu=document.getElementById('search-suggestions'),input=document.getElementById('search');
 if(!menu||!input)return;
 suggestionChoices=suggestedItems();activeSuggestion=-1;
 if(!state.query.trim()){hideSuggestions();return}
 let currentType='';
 const markup=suggestionChoices.map((item,i)=>{
   const heading=item.type!==currentType?`<div class="suggest-heading">${item.type==='artist'?'ARTISTS':item.type==='event'?'GIGS':'FESTIVALS'}</div>`:'';
   currentType=item.type;
   return `${heading}<button type="button" role="option" aria-selected="false" id="suggest-${i}" class="suggest-item" data-suggest="${escapeHtml(item.type)}" data-suggest-id="${escapeHtml(item.id)}"><span class="suggest-name">${escapeHtml(item.name)}</span><span class="suggest-meta">${escapeHtml(item.meta)}</span></button>`;
 }).join('');
 menu.innerHTML=markup||'<div class="suggest-empty">No matching artists, concerts or festivals.</div>';
 menu.hidden=false;input.setAttribute('aria-expanded','true');
}
function chooseSuggestion(type,id){
 hideSuggestions();
 if(type==='artist'){
   state.page='following';state.query=id;render();window.scrollTo({top:0,behavior:'instant'});
 }else if(type==='event'||type==='festival'){
   state.detail=id;render();document.querySelector('.drawer')?.scrollTo({top:0});
 }
}
function refreshSearchView(){
 const view=document.getElementById('page-content');
 if(view)view.innerHTML=state.page==='discover'?discover():followingPage();
 updateSuggestions();
}
function eventsFiltered(onlyFollowing=false){const q=state.query.toLowerCase().trim();const today=new Date().toLocaleDateString('en-CA',{timeZone:'Australia/Sydney'});return events.filter(e=>e.date>=today&&(state.city==='All cities'||e.city===state.city)&&(onlyFollowing||state.genre==='All'||state.genre===e.genre)&&(!onlyFollowing||state.following.has(artistForEvent(e)))&&(!q||[e.name,e.title,e.city,e.venue,e.tour,e.genre].join(' ').toLowerCase().includes(q))).sort((a,b)=>state.sort==='date'?a.date.localeCompare(b.date):(b.detectedAt||'').localeCompare(a.detectedAt||'')||a.date.localeCompare(b.date))}
function eventCard(e){const artist=artistForEvent(e),followed=artist&&state.following.has(artist),label=e.stage==='sold'?'SOLD OUT':e.detectedAt?'NEW LISTING':'VERIFIED LISTING';return `<article class="event-card"><div class="event-art ${e.art}"><div class="art-top"><span class="tag ${e.stage==='sold'?'sold':''}">${label}</span>${artist?`<button type="button" class="heart-btn ${followed?'on':''}" data-follow="${escapeHtml(artist)}" aria-label="${followed?'Unfollow':'Follow'} ${escapeHtml(artist)}" aria-pressed="${!!followed}">${icon('heart')}</button>`:''}</div><div class="art-bottom"><span class="art-date">${date(e.date).toUpperCase()}</span><strong class="art-name">${escapeHtml(e.short||e.name).replace(/\n/g,'<br>')}</strong></div></div><div class="event-body"><h3>${escapeHtml(e.name)}</h3><div class="event-info">${icon('pin')}${escapeHtml(e.venue)} · ${escapeHtml(e.city)}</div><div class="event-info">${icon('calendar')}${date(e.date)}${e.time&&e.time!=='Time TBA'?' · '+escapeHtml(e.time):''}</div><div class="event-bottom"><small class="${e.stage==='sold'?'sold':''}">${tag(e)}</small><button type="button" data-open="${escapeHtml(e.id)}">View event →</button></div></div></article>`}
function filterBar(){return `<div class="filters">${['All','Indie','Rock','Pop','Electronic','Other'].map(c=>`<button type="button" data-genre="${c}" class="chip ${c===state.genre?'active':''}">${c==='All'?'All genres':c}</button>`).join('')}<select id="sort" class="sort" aria-label="Sort events"><option value="new" ${state.sort==='new'?'selected':''}>Recently added</option><option value="date" ${state.sort==='date'?'selected':''}>Event date</option></select></div>`}
function carouselControls(id,count){return `<div class="carousel-tools"><span class="carousel-count" id="count-${id}">01 / ${String(Math.max(1,count)).padStart(2,"0")}</span><span class="carousel-hint">SWIPE TO BROWSE</span><button type="button" data-carousel="${id}" data-dir="-1" aria-controls="carousel-${id}" aria-label="Previous ${id} cards">${icon('arrow')}</button><button type="button" data-carousel="${id}" data-dir="1" aria-controls="carousel-${id}" aria-label="Next ${id} cards">${icon('arrow')}</button></div>`}
function discover(){
const announced=eventsFiltered();
const followed=eventsFiltered(true);
const q=state.query.toLowerCase().trim();
const nearbyFestivals=festivals.filter(f=>(state.city==='All cities'||f.city===state.city)&&(!q||[f.name,f.city,f.venue,...f.lineup].join(' ').toLowerCase().includes(q)));
return `<section class="hero"><div class="hero-inner"><div class="kick">LIVE MUSIC, FIRST</div><h1>NEW<br>SHOWS.<br><span class="outline">NEAR YOU.</span></h1><p>Real concerts from event sources in Sydney, Wollongong and Newcastle, with official event links.</p><div class="hero-buttons"><button type="button" class="primary-btn" data-scroll="announced">Explore shows ${icon('arrow')}</button><button type="button" class="secondary-btn" data-page="following">My artists ${icon('heart')}</button></div></div><button type="button" class="poster-ticket" data-easter="poster" aria-label="Flip the featured poster for a surprise"><span>ENCORE / 001</span><strong>LOUD<br>&<br>LIVE.</strong><small>YOUR CITY · YOUR MUSIC</small></button></section>

<section class="section" id="announced"><div class="section-head"><div><h2>RECENTLY LISTED<span class="section-dot">.</span></h2><p>Real shows from official event sources. Newly listed does not necessarily mean just announced.</p></div>${carouselControls('announced',announced.length)}</div>${filterBar()}<div class="event-grid carousel-track" id="carousel-announced" tabindex="0" role="region" aria-label="Recently listed concerts, scroll horizontally">${announced.length?announced.map(eventCard).join(''):empty('No matching gigs','Try another city, genre or search.')}</div></section>

}
function artistCard(name,i){const on=state.following.has(name),matches=events.filter(e=>artistForEvent(e)===name).length;return `<div class="artist"><span class="artist-avatar ${['art-a','art-b','art-c','art-d','art-e','art-f','art-g','art-h'][i%8]}">${escapeHtml(name.split(' ').map(x=>x[0]).slice(0,2).join(''))}</span><span class="artist-copy"><strong>${escapeHtml(name)}</strong><small>${matches} listed show${matches===1?'':'s'}</small></span><button type="button" class="${on?'on':''}" data-follow="${escapeHtml(name)}">${on?'Following ✓':'+ Follow'}</button></div>`}
function festivalFollowCard(f,i){const on=state.festivals.has(f.id);return `<div class="artist festival-follow-card"><span class="artist-avatar ${f.art||'art-a'}">F</span><span class="artist-copy"><strong>${escapeHtml(f.name)}</strong><small>${escapeHtml(f.city)} · ${date(f.date)}</small></span><button type="button" class="${on?'on':''}" data-festival="${escapeHtml(f.id)}">${on?'Following ✓':'+ Follow'}</button><button type="button" class="festival-detail-link" data-open="${escapeHtml(f.id)}" aria-label="View ${escapeHtml(f.name)} details">Details</button></div>`}
function followingPage(){
 const q=normSearch(state.query);
 const followed=artists.filter(a=>state.following.has(a)&&(!q||normSearch(a).includes(q)));
 const more=artists.filter(a=>!state.following.has(a)&&(!q||normSearch(a).includes(q)));

 return `<section class="page-head"><div class="kick">YOUR MUSIC</div><h1 class="page-title">MY ARTISTS.</h1><p class="page-intro">Manage artists and festivals separately. Followed artists appear on your homepage; festivals have their own list below.</p></section>
 <section class="section"><div class="section-head"><div><h2>FOLLOWING ARTISTS <span style="color:var(--violet)">(${state.following.size})</span></h2><p>The artists you're tracking for new gigs.</p></div><button type="button" data-page="discover">Back to gigs →</button></div><div class="artists-grid">${followed.length?followed.map(n=>artistCard(n,artists.indexOf(n))).join(''):empty('No artists matched','Follow an artist below or adjust your search.')}</div></section>
 <section class="section"><div class="section-head"><div><h2>FIND MORE ARTISTS</h2><p>Only performers from concert listings and festival lineups, not tour titles.</p></div></div><div class="artists-grid">${more.length?more.map(n=>artistCard(n,artists.indexOf(n))).join(''):empty('No other artists matched','Try a different name.')}</div></section>
 <section class="section festival-management"><div class="section-head"><div><h2>FOLLOWING FESTIVALS <span style="color:var(--orange)">(${state.festivals.size})</span></h2><p>Saved festivals are kept separate from your followed artists.</p></div></div><div class="artists-grid">${followedFestivals.length?followedFestivals.map(festivalFollowCard).join(''):empty('No festivals followed yet','Follow a festival below or from the homepage.')}</div></section>
 <section class="section"><div class="section-head"><div><h2>DISCOVER FESTIVALS</h2><p>Follow festivals to keep them in your festival list.</p></div></div><div class="artists-grid">${otherFestivals.length?otherFestivals.map(festivalFollowCard).join(''):empty('No other festivals matched','Try another search.')}</div></section>`;
}

function festivalCard(f){const on=state.festivals.has(f.id),matches=(f.lineup||[]).filter(a=>state.following.has(a));return `<article class="festival-card"><div class="festival-art ${f.art}"><small>${escapeHtml(f.tag||'OFFICIAL EVENT')} · ${escapeHtml(f.city.toUpperCase())}</small><strong>${escapeHtml(f.short||f.name).replace(/\n/g,'<br>')}</strong><small>${date(f.date).toUpperCase()}</small></div><div class="festival-body"><h3>${escapeHtml(f.name)}</h3><div class="event-info">${icon('pin')}${escapeHtml(f.venue)} · ${escapeHtml(f.city)}</div><div class="event-info">${icon('calendar')}${date(f.date)}${f.date2!==f.date?' – '+date(f.date2):''}</div><p><b>Lineup:</b> ${(f.lineup||[]).length?escapeHtml(f.lineup.join(' · ')):'Check official event for full lineup'}</p><div class="match">${(f.lineup||[]).length?matches.length+' followed artists in published lineup':'Lineup matching not yet available'}</div><div class="festival-bottom"><button type="button" data-festival="${escapeHtml(f.id)}">${on?'Following ✓':'+ Follow festival'}</button><button type="button" data-open="${escapeHtml(f.id)}">Event details →</button></div></div></article>`}
function festivalsPage(){const q=state.query.toLowerCase();const list=festivals.filter(f=>(state.city==='All cities'||state.city===f.city)&&(!q||[f.name,f.city,f.venue,...f.lineup].join(' ').toLowerCase().includes(q)));return `<section class="page-head"><div class="kick">BIG DAYS OUT</div><h1 class="page-title">FESTIVAL SEASON.</h1><p class="page-intro">Explore lineups, see which of your artists are playing, and follow festivals for future updates.</p></section><section class="section"><div class="festival-grid">${list.length?list.map(festivalCard).join(''):empty('No festivals found','Try another city or search.')}</div></section>`}
function empty(title,msg){return `<div class="empty"><h3>${title}</h3><p>${msg}</p></div>`}
function eventDetail(e){const artist=artistForEvent(e),on=artist&&state.following.has(artist),rem=state.reminders.has(e.id),sold=e.stage==='sold';const link=verifiedUrl(e.url);return `<div class="drawer-art ${e.art}"><strong>${escapeHtml(e.short||e.name).replace(/\n/g,'<br>')}</strong></div><div class="drawer-content"><div class="kick">VERIFIED EVENT · ${escapeHtml(e.source||'Official listing')}</div><h2 class="detail-title">${escapeHtml(e.name)}</h2><p class="detail-sub">${escapeHtml(e.tour||'')}</p><div class="detail-row">${icon('calendar')}${date(e.date)}${e.time&&e.time!=='Time TBA'?' · '+escapeHtml(e.time):''}</div><div class="detail-row">${icon('pin')}${escapeHtml(e.venue)}, ${escapeHtml(e.city)}, NSW</div><div class="detail-actions">${artist?`<button type="button" class="secondary-btn" data-follow="${escapeHtml(artist)}">${icon('heart')}${on?'Following ✓':'Follow '+escapeHtml(artist)}</button>`:'<span class="detail-sub">Artist not identified from this listing</span>'}<button type="button" class="outline-btn" data-reminder="${escapeHtml(e.id)}">${icon('bell')}${rem?'Saved locally ✓':'Save reminder (demo)'}</button></div><div class="divider"></div><h3 class="detail-heading">ANNOUNCEMENT & TICKETS</h3><div class="timeline"><div class="time-cell"><small>First detected</small><strong>${e.detectedAt?new Date(e.detectedAt).toLocaleDateString('en-AU'):'Not tracked yet'}</strong></div><div class="time-cell"><small>Presale</small><strong>${escapeHtml(e.presale||'Not confirmed')}</strong></div><div class="time-cell"><small>General sale</small><strong>${escapeHtml(e.sale||'Not confirmed')}</strong></div></div><p class="detail-sub" style="margin-top:12px">First detected is not the date the tour was announced. Ticket availability is checked on the seller’s site.</p><div class="divider"></div><h3 class="detail-heading">TICKET OPTIONS</h3><div class="ticket-option"><span><strong>${escapeHtml(e.source||'Official ticket provider')}</strong><small>Verified event page · inventory not checked</small></span>${link?`<a href="${escapeHtml(link)}" target="_blank" rel="noopener noreferrer">Official tickets ↗</a>`:'<small>No verified ticket link</small>'}</div>${(Array.isArray(e.ticketOptions)?e.ticketOptions:[]).filter(t=>verifiedUrl(t.url)).map(t=>`<div class="ticket-option"><span><strong>${escapeHtml(t.source||'Other official seller')}</strong><small>Additional verified event page · availability not checked</small></span><a href="${escapeHtml(verifiedUrl(t.url))}" target="_blank" rel="noopener noreferrer">Official tickets ↗</a></div>`).join('')}<div class="ticket-option"><span><strong>Resale: Tixel & Viagogo</strong><small>No inventory integration yet. Search resale platforms manually; no tickets are claimed available.</small></span></div><p class="detail-note">Event date and venue are sourced from the provider. Following and saved reminders work only in this browser. No background email or resale monitoring is active.</p></div>`}
function festivalDetail(f){const matches=(f.lineup||[]).filter(a=>state.following.has(a)),on=state.festivals.has(f.id),link=verifiedUrl(f.url);return `<div class="drawer-art ${f.art}"><strong>${escapeHtml(f.short||f.name).replace(/\n/g,'<br>')}</strong></div><div class="drawer-content"><div class="kick">OFFICIAL FESTIVAL LISTING · ${escapeHtml(f.source||'Event provider')}</div><h2 class="detail-title">${escapeHtml(f.name)}</h2><div class="detail-row">${icon('calendar')}${date(f.date)}${f.date!==f.date2?' – '+date(f.date2):''}</div><div class="detail-row">${icon('pin')}${escapeHtml(f.venue)}, ${escapeHtml(f.city)}, NSW</div><div class="divider"></div><h3 class="detail-heading">PUBLISHED LINEUP</h3><p class="detail-sub" style="line-height:2.2">${(f.lineup||[]).length?f.lineup.map(a=>state.following.has(a)?`<strong style="color:#16697c">${escapeHtml(a)}</strong>`:escapeHtml(a)).join(' · '):'See the official event page for the lineup.'}</p>${(f.lineup||[]).length?`<div class="match">${matches.length} followed artist${matches.length===1?'':'s'} in this lineup</div>`:''}<div class="detail-actions"><button type="button" class="primary-btn" data-festival="${escapeHtml(f.id)}">${on?'Following festival ✓':'+ Follow festival'}</button>${link?`<a class="secondary-btn" href="${escapeHtml(link)}" target="_blank" rel="noopener noreferrer">Official tickets ↗</a>`:''}</div><p class="detail-note">Lineups can change. Following a festival is stored locally; lineup alerts are not operational yet.</p></div>`}
function detail(){if(!state.detail)return '';const e=events.find(x=>x.id===state.detail),f=festivals.find(x=>x.id===state.detail);if(!e&&!f)return '';return `<div class="shade" id="shade"><section class="drawer" role="dialog" aria-modal="true" aria-label="${e?'Concert':'Festival'} details"><div class="drawer-head"><span>EVENT DETAILS / ENCORE</span><button type="button" class="icon-btn" data-close aria-label="Close event details">${icon('close')}</button></div>${e?eventDetail(e):festivalDetail(f)}</section></div>`}
function verifiedUrl(url){try{const u=new URL(String(url));return u.protocol==='https:'&&['www.moshtix.com.au','moshtix.com.au','www.ticketmaster.com.au','ticketmaster.com.au','www.ticketmaster.com','ticketmaster.com'].includes(u.hostname)?u.href:null}catch(e){return null}}
function escapeHtml(str){return String(str).replaceAll('&','&amp;').replaceAll('"','&quot;').replaceAll('<','&lt;').replaceAll('>','&gt;')}
function render(opts={}){const carousels={};document.querySelectorAll('.carousel-track').forEach(el=>carousels[el.id]=el.scrollLeft);root.innerHTML=`<div class="app">${header()}<main class="content"><div class="demo">${icon('sparkle')}<span>${escapeHtml(dataStatus)} Events link to official providers. Announcement times, availability and notifications are not live.</span></div><div id="page-content">${state.page==='discover'?discover():followingPage()}</div><footer class="footer"><span>ENCORE / Concert discovery</span><span><a href="./privacy.html">Privacy</a><a href="./terms.html">Terms &amp; Conditions</a><span>Prototype V6 · Real listings</span></span></footer></main>${mobileNav()}${detail()}</div>`;document.body.style.overflow=state.detail?'hidden':'';Object.entries(carousels).forEach(([id,left])=>{const el=document.getElementById(id);if(el)el.scrollLeft=left});if(opts.focus){const el=document.getElementById('search');el?.focus();try{el?.setSelectionRange(opts.pos,opts.pos)}catch(e){}}}
function changePage(page){state.page=page;state.query='';state.detail=null;render();window.scrollTo({top:0,behavior:'instant'})}
function close(){state.detail=null;render()}
document.addEventListener('click',e=>{if(e.target.id==='shade'){close();return}const b=e.target.closest('button');if(!b)return;if(b.hasAttribute('data-close')){close();return}if(b.dataset.easter==='poster'){const flip=b.classList.toggle('flipped');b.querySelector('strong').innerHTML=flip?'B-SIDE<br>FOUND.':'LOUD<br>&<br>LIVE.';b.querySelector('small').textContent=flip?'A LITTLE SOMETHING EXTRA':'YOUR CITY · YOUR MUSIC';if(flip)toast('SECRET SIDE FOUND. SEE YOU AT THE GIG.');return}if(b.classList.contains('logo')){const now=Date.now();logoTapCount=now-logoTapTime<850?logoTapCount+1:1;logoTapTime=now;if(logoTapCount===3){logoTapCount=0;document.querySelector('.app')?.classList.add('b-side');toast('ENCORE! YOU FOUND THE HIDDEN TRACK.');setTimeout(()=>document.querySelector('.app')?.classList.remove('b-side'),950);return}}if(b.dataset.carousel){const track=document.getElementById('carousel-'+b.dataset.carousel);if(track){const card=track.querySelector('.event-card,.festival-card');const gap=parseFloat(getComputedStyle(track).gap)||16;const step=(card?.getBoundingClientRect().width||280)+gap;track.scrollBy({left:step*Number(b.dataset.dir||1),behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth'});}return}if(b.dataset.suggest){chooseSuggestion(b.dataset.suggest,b.dataset.suggestId);return}if(b.dataset.page){changePage(b.dataset.page);return}if(b.dataset.scroll){document.getElementById(b.dataset.scroll)?.scrollIntoView({behavior:'instant',block:'start'});return}if(b.dataset.genre){state.genre=b.dataset.genre;render();return}if(b.dataset.follow){const n=b.dataset.follow;const on=state.following.has(n);on?state.following.delete(n):state.following.add(n);save();render();toast(`${n} ${on?'unfollowed':'followed'} (saved in this browser)`);return}if(b.dataset.open){state.detail=b.dataset.open;render();const drawer=document.querySelector('.drawer');if(drawer)drawer.scrollTop=0;return}if(b.dataset.reminder){const id=b.dataset.reminder,on=state.reminders.has(id);on?state.reminders.delete(id):state.reminders.add(id);save();render();toast(on?'Demo reminder removed':'Reminder saved locally: no alerts sent');return}if(b.dataset.watch){const id=b.dataset.watch,on=state.watch.has(id);on?state.watch.delete(id):state.watch.add(id);save();render();toast(on?'Resale watch removed':'Resale watch saved locally: no monitoring active');return}if(b.dataset.festival){const id=b.dataset.festival,on=state.festivals.has(id);on?state.festivals.delete(id):state.festivals.add(id);save();render();toast(on?'Festival unfollowed':'Festival followed (demo)');return}if(b.dataset.info){toast(b.dataset.info)}});
document.addEventListener('input',e=>{if(e.target.id==='search'){state.query=e.target.value;refreshSearchView();}});
document.addEventListener('focusin',e=>{if(e.target.id==='search'&&state.query.trim())updateSuggestions()});
document.addEventListener('pointerdown',e=>{if(!e.target.closest('.search-combo'))hideSuggestions()});
document.addEventListener('change',e=>{if(e.target.id==='city'){state.city=e.target.value;save();render();toast(`Now showing ${state.city.toLowerCase()}`)}if(e.target.id==='sort'){state.sort=e.target.value;render()}});
document.addEventListener('scroll',e=>{const track=e.target;if(!(track instanceof Element)||!track.classList.contains('carousel-track'))return;const counter=document.getElementById('count-'+track.id.replace('carousel-',''));if(!counter)return;const card=track.querySelector('.event-card,.festival-card');const total=track.querySelectorAll('.event-card,.festival-card').length;if(!card||!total)return;const gap=parseFloat(getComputedStyle(track).gap)||0;const n=Math.min(total,Math.max(1,Math.round(track.scrollLeft/(card.getBoundingClientRect().width+gap))+1));counter.textContent=String(n).padStart(2,'0')+' / '+String(total).padStart(2,'0')},true);
document.addEventListener('keydown',e=>{
 if(e.target?.id==='search'&&!e.isComposing){
  const list=document.getElementById('search-suggestions');
  if(['ArrowDown','ArrowUp'].includes(e.key) && !list?.hidden && suggestionChoices.length){
   e.preventDefault();const step=e.key==='ArrowDown'?1:-1;
   activeSuggestion=(activeSuggestion+step+suggestionChoices.length)%suggestionChoices.length;
   list.querySelectorAll('[role="option"]').forEach((n,i)=>{n.classList.toggle('active',i===activeSuggestion);n.setAttribute('aria-selected',String(i===activeSuggestion))});
   e.target.setAttribute('aria-activedescendant','suggest-'+activeSuggestion);
   list.querySelector('#suggest-'+activeSuggestion)?.scrollIntoView({block:'nearest'});
   return;
  }
  if(e.key==='Enter' && !list?.hidden && suggestionChoices.length){
   e.preventDefault();const selected=suggestionChoices[Math.max(activeSuggestion,0)];chooseSuggestion(selected.type,selected.id);return;
  }
  if(e.key==='Escape'){hideSuggestions();e.preventDefault();return;}
 }
 if(e.key==='Escape'&&state.detail)close();
});
render();
async function loadVerifiedEvents(){
 try{
  const res=await fetch('./data/events.json',{cache:'no-cache'});
  if(!res.ok)throw new Error('HTTP '+res.status);
  const d=await res.json();
  if(!Array.isArray(d.events)||!Array.isArray(d.festivals))throw new Error('Invalid event data');
  events.splice(0,events.length,...d.events.filter(e=>e&&e.id&&e.name&&e.date&&e.city&&verifiedUrl(e.url)));
  festivals.splice(0,festivals.length,...d.festivals.filter(f=>f&&f.id&&f.name&&f.date&&f.city&&verifiedUrl(f.url)));
  const festivalNames=new Set(festivals.map(f=>normSearch(f.name)));
  const identities=events.map(artistForEvent).filter(Boolean).concat(festivals.flatMap(f=>f.lineup||[]));
  artists.splice(0,artists.length,...new Set(identities.filter(a=>!festivalNames.has(normSearch(a)))));artists.sort((a,b)=>a.localeCompare(b));
  for(const f of festivals){if(state.following.has(f.name)&&!artists.includes(f.name)){state.following.delete(f.name);state.festivals.add(f.id)}}
  for(const e of events){if(e.artistName&&e.artistName!==e.title&&state.following.has(e.title)){state.following.delete(e.title);state.following.add(e.artistName)}}
  save();
  sourceUpdatedAt=d.updatedAt||null;
  dataStatus='REAL EVENT LISTINGS · '+events.length+' CONCERTS · '+festivals.length+' FESTIVALS · DATA '+(sourceUpdatedAt?new Date(sourceUpdatedAt).toLocaleDateString('en-AU'):'DATE UNKNOWN')+' · '+(d.updateStatus==='seed'?'CURATED STARTER LIST':(Array.isArray(d.sources)&&d.sources.includes('Ticketmaster')?'MOSHTIX + TICKETMASTER':'MOSHTIX SYNC'));
  render();
 }catch(err){dataStatus='Could not load the event feed. Refresh to retry; no fictional data is being shown.';render();console.error('ENCORE feed error:',err)}
}
loadVerifiedEvents();
})();
